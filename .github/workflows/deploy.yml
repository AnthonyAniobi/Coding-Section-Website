name: Deploy to Netlify

on:
  workflow_dispatch:
    inputs:
      production:
        description: Deploy to the production site
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: |
          if [ -z "$VITE_WEB3FORMS_ACCESS_KEY" ]; then
            echo "Missing WEB3FORMS_ACCESS_KEY repository secret."
            exit 1
          fi
          npm run build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "Missing NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID repository secrets."
            exit 1
          fi

          npx --yes netlify-cli deploy \
            --dir=dist \
            --message "GitHub Actions ${GITHUB_SHA}" \
            $([ "${{ inputs.production }}" = "true" ] && echo "--prod")
